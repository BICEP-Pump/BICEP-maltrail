name: Build and publish docker image
on:
  workflow_call:

env:
  BASE_IMAGE: ghcr.io/stamparm/maltrail
  IMAGE_NAME: bicep-maltrail
  IMAGE_REGISTRY: ghcr.io

jobs:
  get_latest_version:
    runs-on: ubuntu-latest
    outputs:
      OFFICIAL_RELEASE_VERSION: ${{ steps.latest_release.outputs.OFFICIAL_RELEASE_VERSION }}
    steps:
      - name: Retrieve latest upstream release tag
        id: latest_release
        shell: bash
        run: |
          OFFICIAL_RELEASE_VERSION=$(curl -fsSL "https://api.github.com/repos/stamparm/maltrail/tags?per_page=20" | jq -r 'map(.name | select(test("^[0-9]+(\\.[0-9]+)*$"))) | sort_by(split(".") | map(tonumber)) | last')
          if [ -z "$OFFICIAL_RELEASE_VERSION" ] || [ "$OFFICIAL_RELEASE_VERSION" = "null" ]; then
            echo "Could not determine the latest upstream Maltrail version"
            exit 1
          fi

          echo "OFFICIAL_RELEASE_VERSION=$OFFICIAL_RELEASE_VERSION" >> "$GITHUB_ENV"
          echo "OFFICIAL_RELEASE_VERSION=$OFFICIAL_RELEASE_VERSION" >> "$GITHUB_OUTPUT"

  build_and_push:
    runs-on: ubuntu-latest
    needs: get_latest_version
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: "true"

      - name: Set image coordinates
        shell: bash
        run: |
          IMAGE_OWNER=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_REPOSITORY=${IMAGE_REGISTRY}/${IMAGE_OWNER}/${IMAGE_NAME}" >> "$GITHUB_ENV"
          echo "OFFICIAL_RELEASE_VERSION=${{ needs.get_latest_version.outputs.OFFICIAL_RELEASE_VERSION }}" >> "$GITHUB_ENV"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker for multiplatform build
        uses: docker/setup-docker-action@v4
        with:
          daemon-config: |
            {
              "debug": true,
              "features": {
                "containerd-snapshotter": true
              }
            }

      - name: Set up QEMU for multi-platform build
        uses: docker/setup-qemu-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64,linux/arm64
          context: ./bicep-maltrail
          file: ./bicep-maltrail/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_REPOSITORY }}:latest
            ${{ env.IMAGE_REPOSITORY }}:${{ env.OFFICIAL_RELEASE_VERSION }}
          build-args: |
            BASE_IMAGE=${{ env.BASE_IMAGE }}
            VERSION=${{ env.OFFICIAL_RELEASE_VERSION }}
